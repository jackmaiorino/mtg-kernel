name: CI

'on':
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer push to a pull request replaces its running CI. Runs on main,
  # tags and manual dispatches finish, because they carry the Windows
  # feature groups that pull requests skip.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # CI builds keep opt-level 3 but skip LTO and use parallel codegen: each
  # feature set is a full release build, and thin LTO with one codegen unit
  # made those builds most of a multi-hour run. Neither setting changes
  # program semantics (Rust never relaxes floating-point arithmetic).
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  detect-changes:
    name: Detect changed paths
    timeout-minutes: 10
    # A few seconds of git work. It stays on a hosted runner: the
    # self-hosted runners hold every job while their host is reserved for
    # other work, and the Python shards wait on this job.
    runs-on: ubuntu-24.04
    outputs:
      python_relevant: ${{ steps.classify.outputs.python_relevant }}
      rust_relevant: ${{ steps.classify.outputs.rust_relevant }}
    steps:
      - name: Check out merge ref with parents
        if: github.event_name == 'pull_request'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 2

      - name: Classify changed paths
        id: classify
        shell: bash
        run: |
          # Non-PR events (push to main, tags, manual dispatch) always run
          # the full matrix: the merge gate must never be narrowed there.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "python_relevant=true" >> "$GITHUB_OUTPUT"
            echo "rust_relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The PR checkout is the synthetic merge commit; HEAD^1 is the
          # base branch tip, so this diff is exactly the PR's file set.
          files=$(git diff --name-only HEAD^1 HEAD)
          echo "changed files:"; echo "$files"
          python_relevant=false
          rust_relevant=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # Python jobs care about python sources/tools/tests, the data
            # artifacts they validate, workflow changes, and the pinned
            # interpreter/lock config. Top-level tools/** is Python only;
            # python/tests imports several of its packages, and the lease
            # adapter's tests run in the Python job's lease guard step.
            case "$f" in
              python/*|data/*|.github/*|uv.lock|pyproject.toml|.python-version|tools/*)
                python_relevant=true ;;
            esac
            # Rust jobs run unless a file is provably outside the crate's
            # input surface. python/mtg_kernel_rl/** stays rust-relevant
            # (embedded authorities: features.py and twins); data/** stays
            # rust-relevant (include_str goldens). Native CI runners are
            # also relevant because they determine which tests execute.
            # Other non-embedded python, top-level tools/** (Python and
            # PowerShell scripts no crate source or test reads), docs, and
            # markdown are irrelevant. build.rs still hashes every tracked
            # file into its provenance digest; no test pins that value.
            case "$f" in
              python/tools/run_rust_workspace_tests.py|python/tools/run_rust_lib_filters.py|python/tools/rust_case_seconds.json|python/tools/rust_limited_only_known_failures.json|python/tools/run_rust_integration_tests.py|python/tools/check_rust_integration_inventory.py|python/tools/limited_muldrotha_session_v12.py|python/tools/limited_tinybones_session_v13.py|python/tools/limited_liliana_session_v14.py|python/tools/limited_chandra_session_v15.py|python/tools/limited_kaito_session_v16.py)
                rust_relevant=true ;;
              python/tests/*|python/tools/*|tools/*|docs/*|*.md) : ;;
              *) rust_relevant=true ;;
            esac
          done <<< "$files"
          echo "python_relevant=$python_relevant" >> "$GITHUB_OUTPUT"
          echo "rust_relevant=$rust_relevant" >> "$GITHUB_OUTPUT"
          echo "verdict: python_relevant=$python_relevant rust_relevant=$rust_relevant"

  rust-quality:
    name: Rust formatting and lint
    needs: detect-changes
    # Same path rule as the Rust test groups: a change that touches only
    # docs, markdown, Python tests, non-embedded Python tools or top-level
    # tools/** cannot change what rustfmt or Clippy see. Pushes to main
    # always run it.
    if: needs.detect-changes.outputs.rust_relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install pinned Rust in a fresh toolchain directory
        shell: bash
        env:
          RUSTUP_HOME: ${{ runner.temp }}/fdn-rustup
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            export RUSTUP_HOME="$(cygpath -w "$RUSTUP_HOME")"
          fi
          printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
          fdn_rust_channel=$(sed -n 's/^channel = "\([^"]*\)".*$/\1/p' rust-toolchain.toml)
          test -n "$fdn_rust_channel"
          rustup toolchain install "$fdn_rust_channel" --profile minimal --component clippy --component rustfmt --no-self-update

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-quality-ubuntu-24.04-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-registry-quality-ubuntu-24.04-

      - name: Cache compiled quality output
        uses: ./.github/actions/cargo-build-cache
        with:
          scope: quality

      - name: Report pinned toolchain
        run: rustc --version --verbose

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --release --locked --workspace --all-targets -- -D warnings

      # Lint only. The joined serializer, warmed encoder allocation and
      # default rules-vector tests run in the workspace group on both systems,
      # and the Limited rules-vector tests in the Limited group; repeating
      # them here cost three more release test builds.
      - name: Run non-Windows native Store feature Clippy
        run: cargo clippy --release --locked -p mtg-kernel --all-targets --features native-training-store-v2-production -- -D warnings

      - name: Run Limited feature Clippy
        run: cargo clippy --release --locked -p mtg-kernel --all-targets --features limited-fdn-fixtures -- -D warnings

      - name: Report generated catalog hashes
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re
          for path in sorted(Path('target/release/build').glob('mtg-kernel-*/out/card_defs.rs')):
              raw = path.read_bytes()
              source = raw.decode('utf-8')
              match = re.search(r'pub const KERNEL_CARDDB_HASH: u64 = (0x[0-9a-f]+)', source)
              count = re.search(r'pub static CARD_DEFS: \[CardDef; (\d+)\]', source)
              if match:
                  print(path, match.group(1), 'definitions=' + (count.group(1) if count else 'unknown'),
                        'sha256=' + hashlib.sha256(raw).hexdigest(), flush=True)
          PY

      - name: Retain generated catalog source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-catalog-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/release/build/mtg-kernel-*/out/card_defs.rs
          if-no-files-found: ignore
          retention-days: 14

      # Hosted runners have no CUDA device, so behavioral CUDA gates run
      # under the local merge protocol; this step still fails closed on any
      # merged change that breaks the CUDA feature's compilation or lints.
      - name: Run CUDA backend feature Clippy (compile gate, no device)
        run: cargo clippy --release --locked -p mtg-kernel --all-targets --features experimental-burn-net8-packed-cuda-v1 -- -D warnings

      - name: Save compiled quality output
        if: success()
        uses: ./.github/actions/cargo-build-cache
        with:
          scope: quality
          mode: save

  # Groups that build their own feature set run as parallel jobs;
  # `rust-tests` below keeps the per-OS check names.
  rust-test-groups:
    name: Rust tests (${{ matrix.os }}, ${{ matrix.group }})
    needs: detect-changes
    if: needs.detect-changes.outputs.rust_relevant == 'true'
    # The limit includes any wait in the self-hosted job-started hook; a
    # cold Windows build has taken about 45 minutes.
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
        # Slowest groups first: runners take matrix jobs in this order.
        group:
          - workspace-lib
          - workspace-targets
          - standard
          - eternal
          - cuda
          - native-store
          - trace
          - saved-input
          - limited-store
        # Pull requests run Windows only for the workspace suites and the
        # native Store group, whose production writer is Windows-only code.
        # The other Windows groups never failed without Linux failing too
        # (2026-10-10 to 10-14), so they run on main, tags and manual
        # dispatches, which still cover every group on both systems.
        exclude: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"windows-2025","group":"standard"},{"os":"windows-2025","group":"eternal"},{"os":"windows-2025","group":"cuda"},{"os":"windows-2025","group":"trace"},{"os":"windows-2025","group":"saved-input"},{"os":"windows-2025","group":"limited-store"}]' || '[]') }}
        include:
          # Linux groups use GitHub's hosted runners, which are free for
          # this public repository: the WSL runners can't be pinned to
          # cores, so they pause for any host reservation.
          - os: ubuntu-24.04
            runner: '"ubuntu-24.04"'
          # Windows groups default to GitHub's hosted runners: on the local
          # pool they queued for over an hour behind research claims. The
          # repository variable routes them elsewhere, for example
          # '["self-hosted", "mtg-ci-windows"]' for the local pool.
          - os: windows-2025
            runner: ${{ vars.MTG_CI_WINDOWS_RUNNER || '"windows-2025"' }}
    # Pull requests from forks never run on the self-hosted runners.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(matrix.runner) || matrix.os }}
    steps:
      # Windows can resolve `bash` to the WSL launcher in System32 first;
      # put Git Bash ahead of it for every later step.
      - name: Use Git Bash for bash steps on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Prepare the self-hosted runner
        if: runner.environment == 'self-hosted'
        run: |
          # Runners without a configured target root keep one beside their
          # work directory, so builds still persist between jobs.
          if [ -z "${MTG_CI_TARGET_ROOT:-}" ]; then
            printf 'MTG_CI_TARGET_ROOT=%s\n' "$RUNNER_WORKSPACE/../../mtg-ci-target" >> "$GITHUB_ENV"
          fi
          cargo_bin=
          if ! command -v rustup >/dev/null && [ -x "$HOME/.cargo/bin/rustup" ]; then
            cargo_bin="$HOME/.cargo/bin"
          elif [ "$RUNNER_OS" = Windows ] && command -v cargo >/dev/null; then
            cargo_bin="$(dirname "$(command -v cargo)")"
          fi
          if [ -n "$cargo_bin" ]; then
            # Python's subprocess calls launch cargo through Windows, which
            # cannot read a bash path such as /c/Users/...; publish a plain
            # Windows path there.
            if [ "$RUNNER_OS" = Windows ]; then
              cargo_bin="$(cygpath -w "$cargo_bin")"
            fi
            echo "Adding the Cargo directory to PATH: $cargo_bin"
            printf '%s\n' "$cargo_bin" >> "$GITHUB_PATH"
          fi

      - name: Install pinned Rust in a fresh toolchain directory
        shell: bash
        env:
          RUSTUP_HOME: ${{ runner.temp }}/fdn-rustup
        run: |
          # Each self-hosted runner keeps its own toolchain directory between
          # jobs; runners on one machine must not share one, because
          # concurrent rustup installs race on its download directory.
          if [ -n "${MTG_CI_TARGET_ROOT:-}" ]; then
            ci_root="$MTG_CI_TARGET_ROOT"
            if [ "$RUNNER_OS" = Windows ]; then
              ci_root="$(cygpath -u "$ci_root")"
            fi
            RUSTUP_HOME="${ci_root%/}-fdn-rustup"
          fi
          if [ "$RUNNER_OS" = Windows ]; then
            export RUSTUP_HOME="$(cygpath -w "$RUSTUP_HOME")"
          fi
          printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
          fdn_rust_channel=$(sed -n 's/^channel = "\([^"]*\)".*$/\1/p' rust-toolchain.toml)
          test -n "$fdn_rust_channel"
          rustup toolchain install "$fdn_rust_channel" --profile minimal --component clippy --component rustfmt --no-self-update

      - name: Set up pinned Python for grouped Rust filters
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version

      - name: Use the runner's persistent target directory
        run: |
          if [ -n "${MTG_CI_TARGET_ROOT:-}" ]; then
            target_dir="$MTG_CI_TARGET_ROOT/${{ matrix.group }}"
            if [ "$RUNNER_OS" = Windows ]; then
              target_dir="$(cygpath -w "$(cygpath -u "$MTG_CI_TARGET_ROOT")/${{ matrix.group }}")"
            fi
            printf 'CARGO_TARGET_DIR=%s\n' "$target_dir" >> "$GITHUB_ENV"
            # With a persistent target directory, incremental compilation
            # rebuilds only the changed parts of the mtg-kernel crate. It
            # does not change program semantics.
            echo 'CARGO_PROFILE_RELEASE_INCREMENTAL=true' >> "$GITHUB_ENV"
          fi

      - name: Cache cargo registry
        if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-tests-${{ matrix.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-registry-tests-${{ matrix.os }}-

      - name: Cache compiled test output
        if: runner.environment == 'github-hosted'
        uses: ./.github/actions/cargo-build-cache
        with:
          scope: tests-${{ matrix.group }}

      - name: Validate MageZero Standard catalog
        if: matrix.group == 'standard'
        run: |
          python python/tools/run_rust_lib_filters.py --features standard-magezero-fixtures card_def:: cast_identity_v1:: cauldron_grants_v1:: rl::legacy_hash_v1:: human_bo3_v1::visible::standard:: resolution_cast_v1:: finalized_case_cast_rejects_a_restored_prior_incarnation_grant engine::standard_spell_copy::tests:: frozen_encoder_rejects_creature_upgrades_in_every_public_zone frozen_encoder_rejects_known_face_down_identities frozen_encoder_rejects_private_face_down_knowledge face_down_crew_payment_reference captured_disguise_stack_target standard_face_down_public_refs channel_payment_preserves_printed_ability_discount counter_removal_payment_accepts_repeated_creature crew_payment_reserves_its_contributors event::tests::heartfire_death_respects_the_pre_zone_change_ability_snapshot engine::legacy_attack_hash_baseline_tests:: engine::anytarget_planeswalker_tests:: native_flat_tensorizer_v5::tests::known_face_down_knowledge_refuses_frozen_successor_encoders effect::squad_rallier_resolution_v1:: rules_meaning_squad_rallier_v1:: self_reflection_v1:: sower_public_v1:: sower_restriction_capture_v1:: rules_meaning_sower_v1:: rl_session::sower_v14:: rl_session::heartfire_v12:: human_bo3_v1::sower_v14:: human_bo3_v1::heartfire_v12:: effect::temporary_control_v1:: authority_of_the_consuls_v1:: rules_meaning_authority_v1:: rules_meaning_employment_v1:: rules_meaning_cerberus_v1:: frenzied_goblin_v1:: wildwood_scourge_v1:: rules_meaning_wildwood_v1:: frenzied_public_v1:: rl_session::frenzied_v15:: rl_session::wildwood_v16:: human_bo3_v1::frenzied_v15:: human_bo3_v1::wildwood_v16:: event::authority_visibility_tests:: rl_session::authority_v17:: employment_public_v1:: rl_session::employment_v18:: cerberus_capture_v1:: cerberus_public_v1:: rl_session::cerberus_v19:: human_bo3_v1::authority_v17:: human_bo3_v1::employment_v18:: human_bo3_v1::cerberus_v19::
          python python/tools/run_rust_integration_tests.py standard_integration --features standard-magezero-fixtures

      # Pauper, Legacy and Vintage catalog: the Standard catalog plus
      # data/eternal_v1. The Standard suite also runs on it, since every
      # Standard card keeps its id and program in this build.
      - name: Validate the eternal catalog
        if: matrix.group == 'eternal'
        run: |
          cargo clippy --release --locked -p mtg-kernel --all-targets --features eternal-fixtures -- -D warnings
          python python/tools/run_rust_lib_filters.py --features eternal-fixtures card_def::
          python python/tools/run_rust_integration_tests.py eternal_integration --features eternal-fixtures
          python python/tools/run_rust_integration_tests.py standard_integration --features eternal-fixtures

      # The library tests and all other targets compile disjoint units, so
      # the two halves of the workspace suite run as parallel jobs.
      - name: Run Rust release tests
        if: startsWith(matrix.group, 'workspace-')
        run: |
          # The hosted Ubuntu runner ran out of memory compiling every
          # non-library target with full parallelism (shutdown signal, exit
          # 143, from 2026-10-27), and with the FDN catalog also at two units
          # at a time, so that half builds one unit at a time.
          if [ "$MATRIX_GROUP" = workspace-targets ] && [ "$MATRIX_OS" = ubuntu-24.04 ]; then
            export CARGO_BUILD_JOBS=1
          fi
          python python/tools/run_rust_workspace_tests.py --part "${MATRIX_GROUP#workspace-}" --no-fail-fast
        env:
          MATRIX_GROUP: ${{ matrix.group }}
          MATRIX_OS: ${{ matrix.os }}

      - name: Check opt-in gameplay decision tracing
        if: matrix.group == 'trace'
        run: |
          cargo clippy --release --locked -p mtg-kernel --all-targets --features gameplay-decision-trace-v1 -- -D warnings
          cargo test --release --locked -p mtg-kernel --features gameplay-decision-trace-v1 --lib gameplay_trace

      - name: Saved input scalar diagnostic guards
        if: matrix.group == 'saved-input'
        run: |
          cargo clippy --release --locked -p mtg-kernel --lib --bin saved_input_scalar_diagnostic --bin gameplay_checkpoint_reconstruction_v1 --features saved-input-scalar-diagnostic,gameplay-checkpoint-reconstruction-v1 -- -D warnings
          cargo test --release --locked -p mtg-kernel --features saved-input-scalar-diagnostic,gameplay-checkpoint-reconstruction-v1 --lib saved_input_scalar_diagnostic::
          cargo test --release --locked -p mtg-kernel --features gameplay-checkpoint-reconstruction-v1 --lib gameplay_checkpoint_reconstruction_v1::tests

      - name: Validate native Store production feature boundary
        if: matrix.group == 'native-store'
        run: |
          cargo test --release --locked -p mtg-kernel --features native-training-store-v2-production --lib native_store_production_capture_v2::
          cargo test --release --locked -p mtg-kernel --features native-training-store-v2-production --test native_cli_platform_stub_v2

      - name: Validate FDN profiles under the native Store feature
        if: matrix.group == 'limited-store'
        run: |
          python python/tools/run_rust_lib_filters.py --features "limited-fdn-fixtures native-training-store-v2-production" pre_fdn_profile prior_fdn_batch fdn_profile_record_round_trips fdn_dual_full_batch dual_engine_full_inventory_preserves_printing_ids fdn_ravenous_partial_batch_remains_readable_but_is_not_live effect::temporary_control_v1:: authority_of_the_consuls_v1:: rules_meaning_authority_v1:: rules_meaning_employment_v1:: rules_meaning_cerberus_v1:: frenzied_goblin_v1:: wildwood_scourge_v1:: rules_meaning_wildwood_v1:: frenzied_public_v1:: rl_session::frenzied_v15:: rl_session::wildwood_v16:: event::authority_visibility_tests:: rl_session::authority_v17:: employment_public_v1:: rl_session::employment_v18:: cerberus_capture_v1:: cerberus_public_v1:: rl_session::cerberus_v19::

      - name: Validate ordinary departures under the native Store feature
        if: matrix.group == 'limited-store'
        run: |
          python python/tools/run_rust_lib_filters.py --features "limited-fdn-fixtures native-training-store-v2-production" ordinary_departure_retains_color_proof actual_grant_source_still_requires_successor

      - name: Test host-safe experimental CUDA feature surface
        if: matrix.group == 'cuda'
        run: |
          cargo test --release --locked -p mtg-kernel --features experimental-burn-net8-packed-cuda-v1 --lib experimental_burn_net8_packed_v1::

      - name: Save compiled test output
        if: success() && runner.environment == 'github-hosted'
        uses: ./.github/actions/cargo-build-cache
        with:
          scope: tests-${{ matrix.group }}
          mode: save

  # Every Limited group uses one feature set. One job per system builds the
  # library tests and the Limited process binaries once, as two parallel
  # parts, instead of each of 22 groups compiling them again.
  limited-build:
    name: Build shared Limited tests (${{ matrix.os }}, ${{ matrix.part }})
    needs: detect-changes
    if: needs.detect-changes.outputs.rust_relevant == 'true'
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # Pull requests run the Limited groups on Linux only.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["ubuntu-24.04", "windows-2025"]') }}
        part:
          - tests
          - binaries
    # Hosted runners only: every hosted job checks out to the same path, so
    # the source paths in Cargo's freshness records stay valid.
    runs-on: ${{ matrix.os }}
    steps:
      # Windows can resolve `bash` to the WSL launcher in System32 first;
      # put Git Bash ahead of it for every later step.
      - name: Use Git Bash for bash steps on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install pinned Rust in a fresh toolchain directory
        env:
          RUSTUP_HOME: ${{ runner.temp }}/fdn-rustup
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            export RUSTUP_HOME="$(cygpath -w "$RUSTUP_HOME")"
          fi
          printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
          fdn_rust_channel=$(sed -n 's/^channel = "\([^"]*\)".*$/\1/p' rust-toolchain.toml)
          test -n "$fdn_rust_channel"
          rustup toolchain install "$fdn_rust_channel" --profile minimal --component clippy --component rustfmt --no-self-update

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-tests-${{ matrix.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-registry-tests-${{ matrix.os }}-

      - name: Build the shared Limited ${{ matrix.part }}
        run: |
          if [ '${{ matrix.part }}' = tests ]; then
            cargo test --release --locked -p mtg-kernel --features limited-fdn-fixtures --lib --no-run
          else
            # Every Limited process binary, including ones added later.
            bins=()
            for source in mtg-kernel/src/bin/kernel_limited_*.rs; do
              name="${source##*/}"
              bins+=(--bin "${name%.rs}")
            done
            cargo build --release --locked -p mtg-kernel --features limited-fdn-fixtures "${bins[@]}"
          fi

      # Keep Cargo's fingerprints and dep-info with the outputs, so the
      # Limited groups reuse them only through Cargo's own freshness checks.
      - name: Package the shared Limited ${{ matrix.part }}
        run: |
          tar -cf limited-${{ matrix.part }}.tar --exclude=release/incremental -C target release
          ls -l limited-${{ matrix.part }}.tar

      - name: Upload the shared Limited ${{ matrix.part }}
        uses: actions/upload-artifact@v4
        with:
          name: limited-build-${{ matrix.os }}-${{ matrix.part }}-${{ github.run_attempt }}
          path: limited-${{ matrix.part }}.tar
          retention-days: 1
          compression-level: 1

  # The Limited groups start from the shared build above.
  rust-limited-groups:
    name: Rust tests (${{ matrix.os }}, ${{ matrix.group }})
    needs: [detect-changes, limited-build]
    if: needs.detect-changes.outputs.rust_relevant == 'true'
    # The limit includes any wait in the self-hosted job-started hook.
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # Pull requests run the Limited groups on Linux only.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["ubuntu-24.04", "windows-2025"]') }}
        # Slowest groups first: runners take matrix jobs in this order.
        group:
          - limited
          - limited-only
          - limited-only-1
          - limited-v2
          - limited-v5
          - limited-v3
          - limited-v1
          - limited-v4
          - limited-v6
          - limited-v7
          - limited-v8
          - limited-model
          - limited-model-1
          - limited-model-2
          - limited-model-3
          - limited-model-4
          - limited-model-5
          - limited-model-6
          - limited-model-7
    # Linux uses hosted runners. Windows follows the routing variable of the
    # other groups; pull requests from forks never run on self-hosted runners.
    runs-on: ${{ matrix.os == 'windows-2025' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.MTG_CI_WINDOWS_RUNNER || '"windows-2025"') || matrix.os }}
    steps:
      # Windows can resolve `bash` to the WSL launcher in System32 first;
      # put Git Bash ahead of it for every later step.
      - name: Use Git Bash for bash steps on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Prepare the self-hosted runner
        if: runner.environment == 'self-hosted'
        run: |
          # Runners without a configured target root keep one beside their
          # work directory, so builds still persist between jobs.
          if [ -z "${MTG_CI_TARGET_ROOT:-}" ]; then
            printf 'MTG_CI_TARGET_ROOT=%s\n' "$RUNNER_WORKSPACE/../../mtg-ci-target" >> "$GITHUB_ENV"
          fi
          cargo_bin=
          if ! command -v rustup >/dev/null && [ -x "$HOME/.cargo/bin/rustup" ]; then
            cargo_bin="$HOME/.cargo/bin"
          elif [ "$RUNNER_OS" = Windows ] && command -v cargo >/dev/null; then
            cargo_bin="$(dirname "$(command -v cargo)")"
          fi
          if [ -n "$cargo_bin" ]; then
            # Python's subprocess calls launch cargo through Windows, which
            # cannot read a bash path such as /c/Users/...; publish a plain
            # Windows path there.
            if [ "$RUNNER_OS" = Windows ]; then
              cargo_bin="$(cygpath -w "$cargo_bin")"
            fi
            echo "Adding the Cargo directory to PATH: $cargo_bin"
            printf '%s\n' "$cargo_bin" >> "$GITHUB_PATH"
          fi

      - name: Install pinned Rust in a fresh toolchain directory
        shell: bash
        env:
          RUSTUP_HOME: ${{ runner.temp }}/fdn-rustup
        run: |
          # Each self-hosted runner keeps its own toolchain directory between
          # jobs; runners on one machine must not share one, because
          # concurrent rustup installs race on its download directory.
          if [ -n "${MTG_CI_TARGET_ROOT:-}" ]; then
            ci_root="$MTG_CI_TARGET_ROOT"
            if [ "$RUNNER_OS" = Windows ]; then
              ci_root="$(cygpath -u "$ci_root")"
            fi
            RUSTUP_HOME="${ci_root%/}-fdn-rustup"
          fi
          if [ "$RUNNER_OS" = Windows ]; then
            export RUSTUP_HOME="$(cygpath -w "$RUSTUP_HOME")"
          fi
          printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
          fdn_rust_channel=$(sed -n 's/^channel = "\([^"]*\)".*$/\1/p' rust-toolchain.toml)
          test -n "$fdn_rust_channel"
          rustup toolchain install "$fdn_rust_channel" --profile minimal --component clippy --component rustfmt --no-self-update

      - name: Set up pinned Python for grouped Rust filters
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version

      - name: Use the runner's persistent target directory
        run: |
          if [ -n "${MTG_CI_TARGET_ROOT:-}" ]; then
            target_dir="$MTG_CI_TARGET_ROOT/${{ matrix.group }}"
            if [ "$RUNNER_OS" = Windows ]; then
              target_dir="$(cygpath -w "$(cygpath -u "$MTG_CI_TARGET_ROOT")/${{ matrix.group }}")"
            fi
            printf 'CARGO_TARGET_DIR=%s\n' "$target_dir" >> "$GITHUB_ENV"
            # With a persistent target directory, incremental compilation
            # rebuilds only the changed parts of the mtg-kernel crate. It
            # does not change program semantics.
            echo 'CARGO_PROFILE_RELEASE_INCREMENTAL=true' >> "$GITHUB_ENV"
          fi

      - name: Cache cargo registry
        if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-tests-${{ matrix.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-registry-tests-${{ matrix.os }}-

      # Self-hosted runners keep their own persistent target directories.
      - name: Download the shared Limited build
        if: runner.environment == 'github-hosted'
        uses: actions/download-artifact@v4
        with:
          pattern: limited-build-${{ matrix.os }}-*-${{ github.run_attempt }}
          merge-multiple: true
          path: limited-build

      # Cargo reuses an output only when it is newer than every source file
      # it recorded. Unpacked files get one time after this checkout, so the
      # Cargo commands below reuse them; anything whose sources, settings or
      # toolchain differ is still rebuilt as usual.
      - name: Unpack the shared Limited build as current output
        if: runner.environment == 'github-hosted'
        run: |
          mkdir -p target
          for archive in limited-build/limited-*.tar; do
            tar -xf "$archive" -C target
          done
          rm -rf limited-build
          stamp=$(date +%s)
          find target -exec touch -d "@$stamp" {} +

      - name: Validate London mulligans and original fixture games
        if: matrix.group == 'limited'
        run: |
          cargo test --release --locked -p mtg-kernel --features limited-fdn-fixtures --test london_mulligans_v1 --test limited_session_v1 --test limited_priority_v1 --test limited_combat_v1 -- --nocapture
          cargo test --release --locked -p mtg-kernel --features limited-fdn-fixtures --lib london_session_snapshot_restores

      - name: Report generated Limited catalog
        if: always() && matrix.group == 'limited' && matrix.os == 'ubuntu-24.04'
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import re
          root = Path(os.environ.get('CARGO_TARGET_DIR', 'target')) / 'release/build'
          for path in sorted(root.glob('mtg-kernel-*/out/card_defs.rs')):
              raw = path.read_bytes()
              source = raw.decode('utf-8')
              match = re.search(r'pub const KERNEL_CARDDB_HASH: u64 = (0x[0-9a-f]+)', source)
              count = re.search(r'pub static CARD_DEFS: \[CardDef; (\d+)\]', source)
              if match:
                  print(path, match.group(1), 'definitions=' + (count.group(1) if count else 'unknown'),
                        'sha256=' + hashlib.sha256(raw).hexdigest(), flush=True)
          PY

      - name: Retain generated Limited catalog source
        if: always() && matrix.group == 'limited' && matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: generated-limited-catalog-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CARGO_TARGET_DIR || 'target' }}/release/build/mtg-kernel-*/out/card_defs.rs
          if-no-files-found: ignore
          retention-days: 14

      - name: Validate FDN Limited gameplay and catalog separation
        if: matrix.group == 'limited'
        run: |
          python python/tools/run_rust_integration_tests.py fdn_integration --features limited-fdn-fixtures
          python python/tools/run_rust_lib_filters.py --features limited-fdn-fixtures limited_session_v1::tests rl::genuine_paid_conqueror_projection_proof_keeps_original_state_rows_and_full_projection_both_seats rl_session::tests card_def:: koma_spell_protection threshold_counts_graveyard native_training_store_run_v2:: policy_observation_v8:: policy_observation_v9:: engine::raid_history_tests:: trigger::tests::raid_ effect::condemn_tests:: effect::run_away_together_tests:: bloodwitch_ engine::anytarget_planeswalker_tests:: rules_meaning_v2:: flat_policy_v4:: native_flat_tensorizer_v4:: native_flat_tensorizer_v5:: native_flat_tensorizer_v6:: rl_session::human_v8:: effect::divine_variable_targets_tests:: engine::divine_variable_targeting_tests:: effect::scavenging_ooze_v1:: ooze_public_v1:: rules_meaning_ooze_v1:: soul_shackled_zombie_v1:: soul_shackled_zombie_public_v1:: rules_meaning_soul_shackled_zombie_v1:: source_power_activation_v1:: heartfire_history_v1:: heartfire_public_v1:: rules_meaning_heartfire_v1:: rl_session::heartfire_v12:: rl_session::heartfire_history_v1:: rl_session::soul_shackled_zombie_v13:: searslicer_goblin_tests:: rules_meaning_searslicer_v1:: effect::squad_rallier_resolution_v1:: rules_meaning_squad_rallier_v1:: self_reflection_v1:: sower_public_v1:: sower_restriction_capture_v1:: rules_meaning_sower_v1:: rl_session::sower_v14:: effect::temporary_control_v1:: authority_of_the_consuls_v1:: rules_meaning_authority_v1:: rules_meaning_employment_v1:: rules_meaning_cerberus_v1:: frenzied_goblin_v1:: wildwood_scourge_v1:: rules_meaning_wildwood_v1:: frenzied_public_v1:: rl_session::frenzied_v15:: rl_session::wildwood_v16:: event::authority_visibility_tests:: rl_session::authority_v17:: employment_public_v1:: rl_session::employment_v18:: cerberus_capture_v1:: cerberus_public_v1:: rl_session::cerberus_v19:: high_society_hunter_ hunter_observation_v45:: rl_session::hunter_v45:: eaten_alive_v1:: eaten_observation_v46:: eaten_public_v46:: rl_session::eaten_v46:: engine::fiendish_panda_targeting_tests:: fiendish_panda_v1:: panda_public_v47:: rl_session::panda_v47::

      - name: Validate new FDN family cores and owned consumers
        if: ${{ !cancelled() && matrix.group == 'limited' }}
        run: |
          python python/tools/run_rust_lib_filters.py --features limited-fdn-fixtures krenko_v1:: krenko_public_v1:: krenko_observation_v1:: rules_meaning_krenko_v1:: rl_session::krenko_v34:: zul_ashur_v1:: zul_ashur_public_v1:: zul_ashur_observation_v1:: rules_meaning_zul_ashur_v1:: rl_session::zul_ashur_v35:: heraldic_banner_v1:: banner_observation_v1:: rules_meaning_heraldic_banner_v1:: rl_session::banner_v36:: effect::inspiration_resolution_v1:: inspiration_observation_v1:: rules_meaning_inspiration_v1:: rl_session::inspiration_v37:: controlled_creature_grants_v1:: twinflame_tyrant_v1:: twinflame_observation_v1:: rl_session::twinflame_v38:: fishing_pole_v39:: fishing_pole_public_v39:: fishing_pole_observation_v39:: rules_meaning_fishing_pole_v39:: rl_session::fishing_pole_v39:: game_outcome_protection_v1:: game_outcome_protection_public_v1:: game_outcome_observation_v41:: rules_meaning_game_outcome_protection_v1:: rl_session::game_outcome_v41:: ajani_full_v42:: ajani_public_v42:: ajani_observation_v42:: rules_meaning_ajani_v42:: rl_session::ajani_v42:: faebloom_trick_v43:: faebloom_public_v43:: faebloom_observation_v43:: rules_meaning_faebloom_v43:: rl_session::faebloom_v43:: fake_your_own_death_v50::

      - name: Check Limited rules-vector trigger context and event classes
        if: matrix.group == 'limited'
        run: cargo test --release --locked -p mtg-kernel --features limited-fdn-fixtures --lib rules_vector_v1::tests

      # Each protocol keeps its complete checks in a separate job. Serial
      # gameplay plus the three process replays exceeded the two-hour limit.
      - name: Validate Limited common server and Python client
        if: ${{ !cancelled() && matrix.group == 'limited-v1' }}
        run: |
          python python/tools/run_rust_lib_filters.py --features limited-fdn-fixtures limited_common_session_v1::
          cargo build --release --locked -p mtg-kernel --features limited-fdn-fixtures --bin kernel_limited_common_env
          binary_suffix=""
          if [ "$RUNNER_OS" = Windows ]; then
            binary_suffix=".exe"
          fi
          # Profile the existing two replays to separate Python work from engine waits.
          MTG_LIMITED_COMMON_TIMING_V1=1 python -m cProfile -s cumulative python/tools/check_limited_common_client_v1.py --binary "${CARGO_TARGET_DIR:-target}/release/kernel_limited_common_env$binary_suffix"

      - name: Validate current Limited V2 server and complete Fake consumers
        if: ${{ !cancelled() && matrix.group == 'limited-v2' }}
        run: |
          python python/tools/run_rust_lib_filters.py --features limited-fdn-fixtures fake_full_engine_admission_v1_tests:: fake_observation_v50:: rules_meaning_fake_your_own_death_v50:: rl_session::fake_v50:: human_bo3_v1::fake_v50:: limited_common_session_v2::
          cargo build --release --locked -p mtg-kernel --features limited-fdn-fixtures --bin kernel_limited_common_env_v2
          binary_suffix=""
          if [ "$RUNNER_OS" = Windows ]; then
            binary_suffix=".exe"
          fi
          MTG_LIMITED_COMMON_TIMING_V2=1 python python/tools/check_limited_common_client_v2.py --binary "${CARGO_TARGET_DIR:-target}/release/kernel_limited_common_env_v2$binary_suffix"

      - name: Validate Ravenous V51 consumers and Limited V3 process
        if: ${{ !cancelled() && matrix.group == 'limited-v3' }}
        run: |
          python python/tools/run_rust_lib_filters.py --features limited-fdn-fixtures ravenous_full_engine_admission_v1_tests:: elenda_public_v52:: elenda_observation_v52:: rl_session::elenda_v52:: human_bo3_v1::elenda_v52:: limited_elenda_session_v4:: rules_meaning_elenda_v52:: state::soul_counter_storage_v1_tests:: event::soul_placement_primitive_v1_tests:: event::ravenous_amulet_paid_future_tests:: soul_transfer_preserves_value_restore_and_overflow_refusal ravenous_amulet_v1:: soul_counters_v1:: ravenous_public_v51:: rules_meaning_ravenous_amulet_v51:: ravenous_observation_v51:: rl_session::ravenous_v51:: limited_common_session_v3::
          cargo build --release --locked -p mtg-kernel --features limited-fdn-fixtures --bin kernel_limited_common_env_v3
          binary_suffix=""
          if [ "$RUNNER_OS" = Windows ]; then
            binary_suffix=".exe"
          fi
          MTG_LIMITED_COMMON_TIMING_V3=1 python python/tools/check_limited_common_client_v3.py --binary "${CARGO_TARGET_DIR:-target}/release/kernel_limited_common_env_v3$binary_suffix"

      - name: Validate Limited V4 Elenda process
        if: ${{ !cancelled() && matrix.group == 'limited-v4' }}
        run: |
          binary_suffix=""
          if [ "$RUNNER_OS" = Windows ]; then
            binary_suffix=".exe"
          fi
          cargo build --release --locked -p mtg-kernel --features limited-fdn-fixtures --bin kernel_limited_elenda_env_v4
          MTG_LIMITED_ELENDA_TIMING_V4=1 python python/tools/check_limited_elenda_client_v4.py --binary "${CARGO_TARGET_DIR:-target}/release/kernel_limited_elenda_env_v4$binary_suffix"

      - name: Validate Prepared V57 consumers and Limited V5 process
        if: ${{ !cancelled() && matrix.group == 'limited-v5' }}
        run: |
          binary_suffix=""
          if [ "$RUNNER_OS" = Windows ]; then
            binary_suffix=".exe"
          fi
          python python/tools/run_rust_lib_filters.py --features limited-fdn-fixtures prepared_observation_v57:: rl_session::prepared_v57:: human_bo3_v1::prepared_v57::
          python python/tools/run_rust_lib_filters.py --features limited-fdn-fixtures --shard-index 0 --shard-count 1 --isolated-cases limited_prepared_session_v5::
          python python/tools/run_rust_lib_filters.py --features limited-fdn-fixtures --shard-index 0 --shard-count 1 --isolated-cases own_registration_v1::tests::
          python python/tools/run_rust_lib_filters.py --features limited-fdn-fixtures midnight_snack_v1:: flamewake_phoenix_v1::v57_genuine_paid_phoenix_and_juggernaut_keep_distinct_combat_facts_and_legacy_refusal_both_seats
          cargo build --release --locked -p mtg-kernel --features limited-fdn-fixtures --bin kernel_limited_prepared_env_v5
          MTG_LIMITED_PREPARED_TIMING_V5=1 python python/tools/check_limited_prepared_client_v5.py --binary "${CARGO_TARGET_DIR:-target}/release/kernel_limited_prepared_env_v5$binary_suffix"
          python python/tools/run_rust_lib_filters.py --features limited-fdn-fixtures limited_match_v1:: limited_rules_only_v1::
          cargo build --release --locked -p mtg-kernel --features limited-fdn-fixtures --bin kernel_limited_match_v1
          python python/tools/limited_match_v1.py smoke --binary "${CARGO_TARGET_DIR:-target}/release/kernel_limited_match_v1$binary_suffix"
          python python/tools/limited_match_v1.py draftzero --binary "${CARGO_TARGET_DIR:-target}/release/kernel_limited_match_v1$binary_suffix"

      - name: Validate successor Limited process plumbing
        if: ${{ !cancelled() && (matrix.group == 'limited-v6' || matrix.group == 'limited-v7' || matrix.group == 'limited-v8') }}
        run: |
          binary_suffix=""
          if [ "$RUNNER_OS" = Windows ]; then
            binary_suffix=".exe"
          fi
          case '${{ matrix.group }}' in
            limited-v6) binary=kernel_limited_next_five_env_v6; client=check_limited_next_five_client_v6.py ;;
            limited-v7) binary=kernel_limited_graveyard_return_env_v7; client=check_limited_graveyard_return_client_v7.py ;;
            limited-v8) binary=kernel_limited_call_env_v8; client=check_limited_call_client_v8.py ;;
          esac
          cargo build --release --locked -p mtg-kernel --features limited-fdn-fixtures --bin "$binary"
          # Seed-123 Full-basic-deck plumbing. Paid Partial-family gameplay
          # remains covered by the complete Limited-only library inventory.
          python "python/tools/$client" --binary "${CARGO_TARGET_DIR:-target}/release/$binary$binary_suffix"

      # Enumerate both compiled subtrees in each job and partition their exact
      # names by recorded duration (python/tools/rust_case_seconds.json).
      # Give each exact case its own 30-minute bound with at most four children,
      # retaining immediate panic details and the complete original inventories.
      - name: Validate complete current mixed model and Human subtrees
        if: ${{ !cancelled() && startsWith(matrix.group, 'limited-model') }}
        run: |
          shard=0
          if [ '${{ matrix.group }}' != limited-model ]; then
            shard='${{ matrix.group }}'
            shard="${shard##*-}"
          fi
          python python/tools/run_rust_lib_filters.py --features limited-fdn-fixtures --shard-index "$shard" --shard-count 8 --isolated-cases --skip-ignored --nocapture current_mixed_policy_v1:: human_bo3_v1::

      # Cases only the Limited build compiles never run in the workspace
      # suite. The runner lists the default build too and runs every such case
      # that no Limited filter above selects, so a new one cannot fall outside
      # CI (known failures: python/tools/rust_limited_only_known_failures.json).
      # Run this existing whole case once through the same bounded runner,
      # retaining a sample with an unambiguous native producer. The inventory
      # scanner excludes this exact covered name from the following step.
      - name: Validate Drakuseth attack and retain its actual event sample
        if: ${{ !cancelled() && matrix.group == 'limited-only' }}
        env:
          MTG_EVENT_SAMPLES_V1: ${{ github.workspace }}/fdn-event-samples
        run: |
          mkdir -p "$MTG_EVENT_SAMPLES_V1"
          python python/tools/run_rust_lib_filters.py --features limited-fdn-fixtures --shard-index 0 --shard-count 1 --isolated-cases --skip-ignored standard_cards_v1::drakuseth_tests::paid_attack_mandatory_first_zero_one_two_other_targets_and_every_target_checkpoint_restore_both_seats

      - name: Retain actual Drakuseth event sample
        if: ${{ always() && matrix.group == 'limited-only' }}
        uses: actions/upload-artifact@v4
        with:
          name: drakuseth-event-sample-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: fdn-event-samples/DrakusethDamageSourceV76.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Validate every other Limited-only library case
        if: ${{ !cancelled() && startsWith(matrix.group, 'limited-only') }}
        run: |
          shard=0
          if [ '${{ matrix.group }}' = limited-only-1 ]; then
            shard=1
          fi
          python python/tools/run_rust_lib_filters.py --features limited-fdn-fixtures --shard-index "$shard" --shard-count 2 --isolated-cases --skip-ignored --limited-only-workflow .github/workflows/ci.yml

  rust-tests:
    name: Rust tests (${{ matrix.os }})
    needs: [detect-changes, rust-test-groups, limited-build, rust-limited-groups]
    if: always() && needs.detect-changes.outputs.rust_relevant == 'true'
    timeout-minutes: 10
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ubuntu-24.04
    steps:
      - name: Require every Rust test group
        run: |
          test "${{ needs.rust-test-groups.result }}" = success
          test "${{ needs.limited-build.result }}" = success
          test "${{ needs.rust-limited-groups.result }}" = success

  python-tests:
    name: Python tests (${{ matrix.os }}, shard ${{ matrix.shard }})
    needs: detect-changes
    if: needs.detect-changes.outputs.python_relevant == 'true'
    # Includes waiting for the same low-priority CPU admission as Rust jobs.
    timeout-minutes: 120
    # Windows' default pwsh fails a step only on its last command's exit code, so an earlier failing command in a
    # multi-line step passes silently. Bash (-eo pipefail) stops at the first failure on both systems.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # Windows runs the suite about twice as slowly, so it gets one more
        # shard to finish alongside the Ubuntu shards.
        include:
          - {os: ubuntu-24.04, shard: 0, shard_count: 2, kernel_bin: target/release/kernel_rl_env}
          - {os: ubuntu-24.04, shard: 1, shard_count: 2, kernel_bin: target/release/kernel_rl_env}
          - {os: windows-2025, shard: 0, shard_count: 3, kernel_bin: target/release/kernel_rl_env.exe}
          - {os: windows-2025, shard: 1, shard_count: 3, kernel_bin: target/release/kernel_rl_env.exe}
          - {os: windows-2025, shard: 2, shard_count: 3, kernel_bin: target/release/kernel_rl_env.exe}
    # Fork pull requests stay hosted; trusted Windows jobs follow the same
    # routing variable as the Rust groups, hosted by default.
    runs-on: ${{ matrix.os == 'windows-2025' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.MTG_CI_WINDOWS_RUNNER || '"windows-2025"') || matrix.os }}
    env:
      MTG_KERNEL_RL_ENV_BIN: ${{ github.workspace }}/${{ matrix.kernel_bin }}
    steps:
      - name: Use Git Bash for bash steps on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Prepare the self-hosted runner
        if: runner.environment == 'self-hosted'
        run: |
          # Runners without a configured target root keep one beside their
          # work directory, so builds still persist between jobs.
          if [ -z "${MTG_CI_TARGET_ROOT:-}" ]; then
            printf 'MTG_CI_TARGET_ROOT=%s\n' "$RUNNER_WORKSPACE/../../mtg-ci-target" >> "$GITHUB_ENV"
          fi
          cargo_bin=
          if ! command -v rustup >/dev/null && [ -x "$HOME/.cargo/bin/rustup" ]; then
            cargo_bin="$HOME/.cargo/bin"
          elif [ "$RUNNER_OS" = Windows ] && command -v cargo >/dev/null; then
            cargo_bin="$(dirname "$(command -v cargo)")"
          fi
          if [ -n "$cargo_bin" ]; then
            # Python's subprocess calls launch cargo through Windows, which
            # cannot read a bash path such as /c/Users/...; publish a plain
            # Windows path there.
            if [ "$RUNNER_OS" = Windows ]; then
              cargo_bin="$(cygpath -w "$cargo_bin")"
            fi
            echo "Adding the Cargo directory to PATH: $cargo_bin"
            printf '%s\n' "$cargo_bin" >> "$GITHUB_PATH"
          fi

      - name: Install pinned Rust in a fresh toolchain directory
        shell: bash
        env:
          RUSTUP_HOME: ${{ runner.temp }}/fdn-rustup
        run: |
          if [ -n "${MTG_CI_TARGET_ROOT:-}" ]; then
            ci_root="$MTG_CI_TARGET_ROOT"
            if [ "$RUNNER_OS" = Windows ]; then
              ci_root="$(cygpath -u "$ci_root")"
            fi
            RUSTUP_HOME="${ci_root%/}-fdn-rustup"
          fi
          if [ "$RUNNER_OS" = Windows ]; then
            export RUSTUP_HOME="$(cygpath -w "$RUSTUP_HOME")"
          fi
          printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
          fdn_rust_channel=$(sed -n 's/^channel = "\([^"]*\)".*$/\1/p' rust-toolchain.toml)
          test -n "$fdn_rust_channel"
          rustup toolchain install "$fdn_rust_channel" --profile minimal --component clippy --component rustfmt --no-self-update

      - name: Cache cargo registry
        if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-python-${{ matrix.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-registry-python-${{ matrix.os }}-

      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version

      - name: Install locked Python environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.29
          uv sync --locked --extra test

      - name: Validate canonical Pauper manifests
        if: matrix.shard == 0
        run: uv run --no-sync python python/tools/generate_pauper_manifests.py --check --repo-root .

      # Offline RunPod lease tools: bounded fakes, no provider, network or subprocess call.
      - name: Lease guard tests
        if: matrix.shard == 0 && runner.os == 'Linux'
        run: |
          uv run --no-sync python -m unittest discover -v -s python/tools/phase1_cloud -p 'test_*.py'
          uv run --no-sync python -m unittest discover -v -s tools/search_sharing_allocation -p 'test_cloud_lease.py'
          cd python/tools/tests && PYTHONPATH=.. uv run --no-sync python -m unittest -v \
            test_nine_deck_cloud_v1.PackageTests.test_tooling_closure_is_complete_from_a_copy

      - name: Use the runner's persistent Python environment build
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          if [ -n "${MTG_CI_TARGET_ROOT:-}" ]; then
            target_dir="$MTG_CI_TARGET_ROOT/python-env"
            kernel_bin="$target_dir/release/kernel_rl_env"
            if [ "$RUNNER_OS" = Windows ]; then
              target_dir="$(cygpath -w "$(cygpath -u "$MTG_CI_TARGET_ROOT")/python-env")"
              kernel_bin="$target_dir/release/kernel_rl_env.exe"
            fi
            printf 'CARGO_TARGET_DIR=%s\n' "$target_dir" >> "$GITHUB_ENV"
            printf 'MTG_KERNEL_RL_ENV_BIN=%s\n' "$kernel_bin" >> "$GITHUB_ENV"
            echo 'CARGO_PROFILE_RELEASE_INCREMENTAL=true' >> "$GITHUB_ENV"
          fi

      - name: Cache compiled Python environment
        if: runner.environment == 'github-hosted'
        uses: ./.github/actions/cargo-build-cache
        with:
          scope: python-env

      - name: Build release JSONL environment
        run: cargo build --release --locked --bin kernel_rl_env

      # Shards of one system build the same output; the first one saves it.
      - name: Save compiled Python environment
        if: success() && matrix.shard == 0 && runner.environment == 'github-hosted'
        uses: ./.github/actions/cargo-build-cache
        with:
          scope: python-env
          mode: save

      - name: Run Python test shard against the real Rust environment
        run: uv run --no-sync python python/tools/run_python_test_shard.py --shard-index ${{ matrix.shard }} --shard-count ${{ matrix.shard_count }}
