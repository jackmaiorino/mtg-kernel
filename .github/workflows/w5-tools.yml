name: W5 tools

# W5 launcher, Stage 0b, reader and driver tools (tools/w5). The cgroup v2 acceptance runs the real
# launcher as root on an Ubuntu runner: ledger within 1% of summed per-process CPU over a pause, a
# filler run and a resume, plus a restart and an OOM kill.

on:
  push:
    branches: [main]
    paths: ['tools/w5/**', '.github/workflows/w5-tools.yml']
  pull_request:
    paths: ['tools/w5/**', '.github/workflows/w5-tools.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: W5 tools unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      # The E13 reader's Spellbench parity and end-to-end read use Spellbench's published
      # pauper-ladder-v1 snapshot at a pinned commit (spellbench main after #265).
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: jackmaiorino/spellbench
          ref: beb4a08be74d370e5ef37e8617d5d9bb9d1ed329
          path: spellbench-pinned
      - name: Unit tests
        shell: bash
        env:
          SPELLBENCH_ROOT: ${{ github.workspace }}/spellbench-pinned
          W5_READ_RECEIPT: ${{ github.workspace }}/w5-read-demo-${{ matrix.os }}.json
        run: |
          python -m pip install --disable-pip-version-check "numpy>=1.26,<3"
          python -m unittest discover -v -s tools/w5/tests -p 'test_*.py'
      - name: Keep the receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: w5-unit-receipts-${{ matrix.os }}
          path: w5-*.json
          if-no-files-found: ignore

  cgroup-acceptance:
    name: W5 launcher cgroup v2 acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Host facts
        run: |
          uname -a
          stat -fc %T /sys/fs/cgroup
          cat /sys/fs/cgroup/cgroup.subtree_control
          lscpu | head -20
      - name: Acceptance (pause, filler, resume, restart, OOM)
        run: sudo python3 tools/w5/tests/cgroup_acceptance.py --receipt w5box-acceptance.json
      - name: Keep the receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: w5box-acceptance
          path: w5box-acceptance.json
          if-no-files-found: ignore
