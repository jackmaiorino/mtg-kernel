name: Mac runner heartbeat

# A no-op job on the Mac runners (Linux arm64 VM on the Mac Studio) every five
# minutes. CI's job token cannot list self-hosted runners, so
# tools/ci/mac_route.py reads these runs instead: it routes groups to the Mac
# only while the last heartbeat is recent and none waits for a runner.
# The job checks out and runs no repository code.
'on':
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  # Measurement branch only: lets pushes feed heartbeats before the file is on main.
  push:
    branches: [claude/speed-ci-mac-heartbeat-probe]

permissions: {}

jobs:
  heartbeat:
    name: Mac runner heartbeat
    # Scheduled runs use the default branch's file; a manual run only by the owner.
    if: github.event_name == 'schedule' || github.actor == github.repository_owner
    runs-on: [self-hosted, Linux, ARM64, fleet-mac-linux]
    timeout-minutes: 5
    steps:
      - name: Report the runner
        run: |
          echo "runner $RUNNER_NAME"
          df -h "$HOME" | tail -n 1
          free -g | head -n 2
