name: Build probe

# Experiment, not for merge. The real two-compile case of the CI: the
# library and its test build compiled side by side at two Cargo jobs, as
# the workspace-targets job on main does. Run with the 12 GB swap file the
# heavy jobs add today (file) and with compressed in-memory swap and no
# swap file (zram), on whatever machine GitHub hands out. Each job keeps a
# comment on the pull request up to date with its readings.
'on':
  pull_request:
    paths:
      - .github/workflows/build-probe.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: build-probe-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_BUILD_JOBS: "2"

jobs:
  build:
    name: Build (${{ matrix.build }}, ${{ matrix.arm }}, ${{ matrix.rep }})
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - {build: pair, arm: zram, rep: 1}
          - {build: pair, arm: zram, rep: 2}
          - {build: pair, arm: zram, rep: 3}
          - {build: pair, arm: zram, rep: 4}
          - {build: pair, arm: file, rep: 1}
          - {build: pair, arm: file, rep: 2}
          - {build: single, arm: zram, rep: 1}
          - {build: single, arm: zram, rep: 2}
    steps:
      - name: What machine is this
        id: facts
        run: |
          set +e
          vendor=$(cat /sys/class/dmi/id/sys_vendor 2>/dev/null)
          product=$(cat /sys/class/dmi/id/product_name 2>/dev/null)
          azsize=$(curl -s -m 3 -H Metadata:true "http://169.254.169.254/metadata/instance/compute/vmSize?api-version=2021-02-01&format=text" | head -c 30 | tr -cd 'A-Za-z0-9_')
          case "$vendor" in *Amazon*) azsize="";; esac
          rootdev=$(findmnt -n -o SOURCE /)
          swaps=$(awk 'NR>1 {printf "%s(%d MiB,prio %s) ", $1, $3/1024, $5}' /proc/swaps)
          note="vendor $vendor; product $product; azure size $azsize; kernel $(uname -r); root $rootdev; swap at boot: $swaps"
          echo "$note"
          echo "note=$note" >> "$GITHUB_OUTPUT"
          free -m
          df -h /

      - name: Swap file, as the heavy CI jobs have it
        if: matrix.arm == 'file'
        run: |
          sudo fallocate -l 12G /mnt/build.swap
          sudo chmod 600 /mnt/build.swap
          sudo mkswap /mnt/build.swap
          sudo swapon /mnt/build.swap
          cat /proc/swaps

      - name: Compressed in-memory swap and no swap file
        if: matrix.arm == 'zram'
        run: |
          sudo modprobe zram || true
          if grep -q '^/dev/zram0' /proc/swaps; then sudo swapoff /dev/zram0; fi
          echo 1 | sudo tee /sys/block/zram0/reset
          echo zstd | sudo tee /sys/block/zram0/comp_algorithm
          echo 24G | sudo tee /sys/block/zram0/disksize
          sudo mkswap /dev/zram0
          sudo swapon -p 100 /dev/zram0
          cat /proc/swaps

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Readings that outlive the runner
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CASE: ${{ matrix.build }}-${{ matrix.arm }}-${{ matrix.rep }}
          NOTE: ${{ steps.facts.outputs.note }}
        run: |
          umask 077
          printf '%s' "$GH_TOKEN" > "$RUNNER_TEMP/starve-token"
          nohup sudo python3 tools/ci/starve.py watch --label "$CASE" --token-file "$RUNNER_TEMP/starve-token" \
            --repo "$GITHUB_REPOSITORY" --pr "$PR" --run "$GITHUB_RUN_ID" --note "$NOTE" --log "$RUNNER_TEMP/starve-watch.log" \
            --max-puts 60 --short-every 30 --calm-every 90 --keep 40 \
            > "$RUNNER_TEMP/starve-watch.out" 2>&1 < /dev/null &
          sleep 4
          cat "$RUNNER_TEMP/starve-watch.out"

      # pair: what workspace-targets builds on main, the library and its test
      # build side by side at two Cargo jobs. single: the shared Limited test
      # build, one whole-crate unit, the case that remains after the pair is
      # separated.
      - name: The compile
        env:
          BUILD: ${{ matrix.build }}
        run: |
          set +e
          date -u +"started %H:%M:%S UTC"
          if [ "$BUILD" = pair ]; then
            /usr/bin/time -v cargo test --release --locked --workspace --bins --benches --examples --no-run 2> "$RUNNER_TEMP/cargo.err"
          else
            /usr/bin/time -v cargo test --release --locked -p mtg-kernel --features limited-fdn-fixtures --lib --no-run 2> "$RUNNER_TEMP/cargo.err"
          fi
          code=$?
          date -u +"ended %H:%M:%S UTC, cargo exit $code"
          grep -E "Finished|error|Maximum resident|Elapsed|signal" "$RUNNER_TEMP/cargo.err" | tail -n 12
          free -m
          cat /proc/swaps
          if [ -e /sys/block/zram0/mm_stat ]; then echo "zram mm_stat: $(cat /sys/block/zram0/mm_stat)"; fi
          sudo dmesg | grep -i -E "out of memory|oom-kill|killed process|blocked for more|hung" | tail -n 8 || true
          exit $code

      - name: Readings, last lines
        if: always()
        run: |
          cat "$RUNNER_TEMP/starve-watch.out" || true
          grep -E "avail= *[0-9]{1,3} " "$RUNNER_TEMP/starve-watch.log" | tail -n 5 || true
          tail -n 40 "$RUNNER_TEMP/starve-watch.log" || true
