name: Integration inventory parity

'on':
  pull_request:

permissions:
  contents: read

jobs:
  inventory:
    name: Inventory (${{ matrix.os }}, ${{ matrix.suite }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        include:
          - suite: fdn_integration
            features: limited-fdn-fixtures
          - suite: standard_integration
            features: standard-magezero-fixtures
        suite: [fdn_integration, standard_integration]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: coverage-baseline
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Install pinned Rust
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)".*$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --no-self-update
      - name: Compare compiled test names
        run: python python/tools/check_rust_integration_inventory.py --baseline coverage-baseline --target-root "${{ runner.temp }}/inventory-target" ${{ matrix.suite }} --features ${{ matrix.features }}
