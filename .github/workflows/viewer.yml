name: Viewer
on:
  pull_request:
    paths: ['viewer/**', 'python/tools/viewer_*', 'python/tests/test_viewer_*', '.github/workflows/viewer.yml']
  push:
    branches: [main]
    paths: ['viewer/**', 'python/tools/viewer_*', '.github/workflows/viewer.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: viewer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.0'
      - run: npm install --global npm@11.18.0
      - run: npm ci
        working-directory: viewer
      - run: npm test && npm run build
        working-directory: viewer
      - run: python3 -m unittest discover -s python/tests -p 'test_viewer_export_v1.py'
      - run: npx playwright install --with-deps chromium
        working-directory: viewer
      - run: npm run test:browser
        working-directory: viewer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: viewer-browser-evidence
          path: viewer/test-results
          retention-days: 14
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.0'
      - run: npm install --global npm@11.18.0
      - run: npm ci
        working-directory: viewer
      - name: Materialize verified public demo pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(python3 -c "import json; print(json.load(open('viewer/demo-release.json'))['tag'])")
          gh release download "$tag" --pattern 'viewer-demo.zip' --dir /tmp/viewer-demo
          python3 python/tools/viewer_demo_pack_v1.py unpack /tmp/viewer-demo/viewer-demo.zip viewer/public/demo --release viewer/demo-release.json
      - run: npm run build
        working-directory: viewer
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: viewer/dist
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
