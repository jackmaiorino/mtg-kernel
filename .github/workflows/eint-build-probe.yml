name: Eternal integration build probe (not for merge)

# Measures the compile of the Eternal integration suite on a hosted Linux
# runner with 2 and with 4 Cargo jobs, twice each (hosted runners come in two
# speeds). Runs only on pushes to its own branch. Not for merge.
'on':
  push:
    branches:
      - claude/speed-eint-build-jobs-probe-20261124

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  build:
    name: Build with ${{ matrix.jobs }} Cargo jobs (run ${{ matrix.rep }})
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        jobs: [2, 4]
        rep: [1, 2]
    defaults:
      run:
        shell: bash
    steps:
      - name: Add swap space for the heavy builds
        run: |
          sudo modprobe zram
          if grep -q '^/dev/zram0 ' /proc/swaps; then sudo swapoff /dev/zram0; fi
          echo 1 | sudo tee /sys/block/zram0/reset > /dev/null
          echo zstd | sudo tee /sys/block/zram0/comp_algorithm > /dev/null
          echo 24G | sudo tee /sys/block/zram0/disksize > /dev/null
          sudo mkswap /dev/zram0
          sudo swapon -p 100 /dev/zram0
          free -m

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Guard the hosted Linux runner's memory
        id: memory_guard
        uses: ./.github/actions/memory-guard

      - name: Install pinned Rust in a fresh toolchain directory
        env:
          RUSTUP_HOME: ${{ runner.temp }}/fdn-rustup
        run: |
          printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
          fdn_rust_channel=$(sed -n 's/^channel = "\([^"]*\)".*$/\1/p' rust-toolchain.toml)
          test -n "$fdn_rust_channel"
          rustup toolchain install "$fdn_rust_channel" --profile minimal --no-self-update

      - name: Set up pinned Python for the integration runner
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version

      - name: Report the runner's processor
        run: |
          nproc
          grep -m1 'model name' /proc/cpuinfo
          free -g | head -n 2

      - name: Build the Eternal integration suite
        run: |
          export CARGO_BUILD_JOBS=${{ matrix.jobs }}
          start=$(date +%s)
          python python/tools/run_rust_integration_tests.py eternal_integration --features eternal-fixtures --no-run
          end=$(date +%s)
          echo "PROBE jobs=${{ matrix.jobs }} rep=${{ matrix.rep }} build_seconds=$((end - start)) cpu=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report the hosted Linux runner's memory use
        if: always() && steps.memory_guard.outcome == 'success'
        uses: ./.github/actions/memory-guard
        with:
          mode: report
