<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RS0 position review</title>
<style>
:root { --bg:#f7f7f5; --panel:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#deddd8; --hero:#2f6db5; --opp:#b5562f;
  --ok:#2e7d4f; --no:#b23b3b; --hidden:#8a6d1f; --chip:#efeee9; }
@media (prefers-color-scheme: dark) { :root { --bg:#181816; --panel:#222220; --ink:#ecebe6; --muted:#9a9993; --line:#3a3936;
  --hero:#6ea2e6; --opp:#e38c65; --ok:#64c08a; --no:#e57a7a; --hidden:#d6b55a; --chip:#2e2d2a; } }
* { box-sizing:border-box; }
body { margin:0; font:14px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--ink); display:grid;
  grid-template-columns:260px 1fr; height:100vh; }
nav { border-right:1px solid var(--line); overflow:auto; padding:8px; }
nav button { display:block; width:100%; text-align:left; border:0; background:none; color:inherit; padding:5px 6px;
  border-radius:4px; cursor:pointer; font-size:12px; }
nav button.on { background:var(--chip); font-weight:600; }
nav .done::after { content:" ✓"; color:var(--ok); }
main { overflow:auto; padding:12px 16px 40px; }
h1 { font-size:16px; margin:0 0 4px; } h2 { font-size:14px; margin:14px 0 6px; }
.muted { color:var(--muted); } .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:8px 10px; margin:8px 0; }
.player h3 { margin:0 0 4px; font-size:13px; } .hero h3 { color:var(--hero); } .opp h3 { color:var(--opp); }
.zone { margin:3px 0; } .zone b { display:inline-block; min-width:84px; font-weight:500; color:var(--muted); font-size:12px; }
.card { display:inline-block; background:var(--chip); border-radius:4px; padding:1px 6px; margin:1px 2px; font-size:12px; }
.card.tapped { opacity:.55; font-style:italic; } .card.secret { outline:1px dashed var(--hidden); }
.hide { color:var(--muted); font-style:italic; font-size:12px; }
table { border-collapse:collapse; font-size:12px; } td, th { border:1px solid var(--line); padding:2px 8px; text-align:center; }
.found { color:var(--ok); font-weight:600; } .miss { color:var(--no); }
ol, ul { margin:4px 0; padding-left:22px; } li { font-size:12.5px; }
li.p0 { color:var(--hero); } li.p1 { color:var(--opp); } li.forced { opacity:.6; }
.turn { font-weight:600; margin-top:6px; color:var(--muted); font-size:12px; }
fieldset { border:1px solid var(--line); border-radius:6px; margin:6px 0; } legend { font-size:12px; color:var(--muted); }
label { margin-right:12px; cursor:pointer; } textarea { width:100%; min-height:60px; font:inherit; background:var(--panel); color:inherit;
  border:1px solid var(--line); border-radius:4px; }
.save { padding:6px 14px; font-weight:600; cursor:pointer; } .tabs button { padding:3px 10px; cursor:pointer; }
.tabs button.on { font-weight:700; } details summary { cursor:pointer; color:var(--muted); font-size:12px; }
@media (max-width:760px) { body { grid-template-columns:1fr; height:auto; } nav { max-height:30vh; } }
</style>
</head>
<body>
<nav id="list"><div class="muted">Loading…</div></nav>
<main id="view"></main>
<script>
"use strict";
const S = { positions: [], verdicts: {}, i: 0, board: "root", hidden: false, forced: false };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const seatName = (p, seat) => seat === p.focal ? "You (hero)" : "Opponent";
const short = id => id.replace(/^r2-s1-b512-vs-/, "vs ");

function card(c, secret) {
  const bits = [];
  if (c.pt) bits.push(`${c.pt[0]}/${c.pt[1]}`);
  if (c.plus1) bits.push(`+${c.plus1}`);
  if (c.damage) bits.push(`${c.damage} dmg`);
  if (c.sick) bits.push("sick");
  return `<span class="card${c.tapped ? " tapped" : ""}${secret ? " secret" : ""}" title="object ${c.id}">${esc(c.name)}${bits.length ? " · " + bits.join(" ") : ""}${c.tapped ? " (tapped)" : ""}</span>`;
}
function zone(name, cards, secret, limit) {
  if (secret && !S.hidden) return `<div class="zone"><b>${name}</b><span class="hide">${cards.length} hidden</span></div>`;
  const shown = limit ? cards.slice(0, limit) : cards;
  const more = cards.length > shown.length ? ` <span class="muted">… ${cards.length - shown.length} more</span>` : "";
  return `<div class="zone"><b>${name}</b>${shown.map(c => card(c, secret)).join("") || '<span class="muted">none</span>'}${more}</div>`;
}
function player(p, b, seat) {
  const x = b.players[seat], hero = seat === p.focal;
  const pool = x.mana_pool.some(Boolean) ? ` · pool W${x.mana_pool[0]} U${x.mana_pool[1]} B${x.mana_pool[2]} R${x.mana_pool[3]} G${x.mana_pool[4]} C${x.mana_pool[5]}` : "";
  const lands = x.battlefield.filter(c => !c.pt), creatures = x.battlefield.filter(c => c.pt);
  return `<div class="panel player ${hero ? "hero" : "opp"}"><h3>${seatName(p, seat)} · ${x.life} life${pool}${b.active === seat ? " · active" : ""}</h3>
    ${zone("Hand", x.hand, !hero)}${zone("Creatures", creatures)}${zone("Other perms", lands)}
    ${zone("Graveyard", x.graveyard.slice().reverse())}${x.exile.length ? zone("Exile", x.exile) : ""}
    ${zone("Library (top first)", x.library, true, 12)}</div>`;
}
function boardView(p) {
  const at = p[S.board], b = at.board, opp = 1 - p.focal;
  const stack = b.stack.length ? `<div class="panel"><b>Stack</b> ${b.stack.map(s => card(s.source)).join("")}</div>` : "";
  return `<div class="row tabs"><button class="${S.board === "root" ? "on" : ""}" data-board="root">Root (decision ${p.index})</button>
    <button class="${S.board === "certified" ? "on" : ""}" data-board="certified">Certified decision (${p.certified_index})</button>
    <label><input type="checkbox" id="hidden" ${S.hidden ? "checked" : ""}> Show hidden information (hands, library order)</label></div>
    <div class="muted">Turn ${b.turn} · ${esc(b.step)} · ${b.active === p.focal ? "your" : "opponent's"} turn · ${at.actor === p.focal ? "you" : "opponent"} to act</div>
    ${player(p, b, opp)}${stack}${player(p, b, p.focal)}`;
}
function rs0(p) {
  const budgets = Object.keys(p.rs0).sort((a, b) => a - b);
  if (!budgets.length) return '<span class="muted">no RS0 rows</span>';
  return `<table><tr><th>Budget</th>${budgets.map(b => `<th>${Number(b).toLocaleString()}</th>`).join("")}</tr>
    <tr><td>found (seeds)</td>${budgets.map(b => { const s = Object.values(p.rs0[b]); const f = s.filter(x => x.found).length;
      return `<td class="${f ? "found" : "miss"}">${f ? "found" : "not found"} ${f}/${s.length}</td>`; }).join("")}</tr></table>`;
}
function pathView(p) {
  let turn = null, out = "";
  for (const d of p.path) {
    if (!S.forced && d.legal < 2) continue;
    if (d.turn !== turn) { turn = d.turn; out += `<div class="turn">Turn ${turn}</div>`; }
    out += `<li class="p${d.actor === p.focal ? 0 : 1}${d.legal < 2 ? " forced" : ""}" value="${d.index}">${d.actor === p.focal ? "You" : "Opp"} · ${esc(d.step)} · ${esc(d.action)} <span class="muted">(${d.selected + 1} of ${d.legal})</span></li>`;
  }
  return `<label><input type="checkbox" id="forced" ${S.forced ? "checked" : ""}> Show forced moves</label><ol>${out || '<span class="muted">no decisions</span>'}</ol>`;
}
function form(p) {
  const v = S.verdicts[p.root_id] || {};
  const radio = (field, opts) => opts.map(([val, text]) => `<label><input type="radio" name="${field}" value="${val}" ${v[field] === val ? "checked" : ""}> ${text}</label>`).join("");
  return `<div class="panel"><h2>Your verdict</h2>
    <fieldset><legend>Is the certified line a real win given visible information?</legend>${radio("real_win", [["yes", "Yes"], ["no", "No"], ["hidden", "Depends on hidden info"]])}</fieldset>
    <fieldset><legend>Would a strong human find it from this root?</legend>${radio("human_find", [["yes", "Yes"], ["maybe", "Maybe"], ["no", "No"]])}</fieldset>
    <fieldset><legend>How would they find it?</legend>${radio("how", [["backward", "Backward from the win"], ["forward", "Forward"], ["both", "Both"]])}</fieldset>
    <textarea id="note" placeholder="Note">${esc(v.note)}</textarea>
    <div class="row"><button class="save" id="save">Save and next</button><span id="status" class="muted">${v.reviewed_at ? "saved " + esc(v.reviewed_at) : "not reviewed"}</span>
    <span class="muted">Keys: j / k next / previous, h toggles hidden info</span></div></div>`;
}
function render() {
  const p = S.positions[S.i];
  document.getElementById("list").innerHTML = `<div class="muted" style="margin:4px 6px">${Object.keys(S.verdicts).length} of ${S.positions.length} reviewed</div>` +
    S.positions.map((q, i) => `<button data-i="${i}" class="${i === S.i ? "on" : ""} ${S.verdicts[q.root_id] ? "done" : ""}">${q.role} · ${esc(short(q.game_id))} · #${q.index}</button>`).join("");
  if (!p) { document.getElementById("view").innerHTML = "<p>No positions.</p>"; return; }
  const decks = p.deck_ids.map(d => d.split("/")[0]);
  const robust = p.robust.verdict ? `robust: ${esc(p.robust.verdict)}${p.robust.same_line === false ? " (different line)" : ""}` : "";
  document.getElementById("view").innerHTML = `<h1>${esc(p.game_id)} · ${p.role === "k2" ? "2 turns back" : p.role === "k1" ? "1 turn back" : esc(p.role)}</h1>
    <div class="muted">You play ${esc(decks[p.focal])} vs ${esc(decks[1 - p.focal])} · root decision ${p.index} · certified win at decision ${p.certified_index} (turn ${p.opportunity_turn}) · game winner: ${p.winner === p.focal ? "you" : p.winner == null ? "draw" : "opponent"}</div>
    <div class="panel"><b>RS0 forward search from this root</b> ${rs0(p)}</div>
    ${boardView(p)}
    <details><summary>Legal actions at the ${S.board === "root" ? "root" : "certified decision"} (${p[S.board].legal.length})</summary><ol start="0">${p[S.board].legal.map(a => `<li>${esc(a)}</li>`).join("")}</ol></details>
    <h2>What was played from the root to the certified decision</h2>${pathView(p)}
    <h2>At the certified decision</h2><div class="panel">Model chose: <b>${esc(p.certified.chosen)}</b></div>
    <div class="panel"><b>Certified line</b> <span class="muted">(oracle proof, ${p.oracle_nodes.toLocaleString()} nodes; ${robust})</span><ol>${p.line.map(a => `<li>${esc(a)}</li>`).join("")}</ol></div>
    ${form(p)}`;
}
function go(i) { S.i = Math.max(0, Math.min(S.positions.length - 1, i)); S.board = "root"; render(); window.scrollTo(0, 0); }
async function save() {
  const p = S.positions[S.i], pick = n => (document.querySelector(`input[name=${n}]:checked`) || {}).value;
  const body = { root_id: p.root_id, real_win: pick("real_win"), human_find: pick("human_find"), how: pick("how"), note: document.getElementById("note").value };
  const r = await fetch("api/verdicts", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) { document.getElementById("status").textContent = "not saved: " + await r.text(); return; }
  S.verdicts[p.root_id] = await r.json();
  go(S.i + 1);
}
document.addEventListener("click", e => {
  const t = e.target.closest("button,input");
  if (!t) return;
  if (t.dataset.i) go(Number(t.dataset.i));
  else if (t.dataset.board) { S.board = t.dataset.board; render(); }
  else if (t.id === "hidden") { S.hidden = t.checked; render(); }
  else if (t.id === "forced") { S.forced = t.checked; render(); }
  else if (t.id === "save") save();
});
document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA") return;
  if (e.key === "j") go(S.i + 1);
  else if (e.key === "k") go(S.i - 1);
  else if (e.key === "h") { S.hidden = !S.hidden; render(); }
});
Promise.all([fetch("api/positions").then(r => r.json()), fetch("api/verdicts").then(r => r.json())]).then(([b, v]) => {
  S.positions = b.positions; S.verdicts = v;
  const first = S.positions.findIndex(p => !v[p.root_id]);
  S.i = first < 0 ? 0 : first;
  render();
});
</script>
</body>
</html>
